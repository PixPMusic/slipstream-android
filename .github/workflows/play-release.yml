name: Play release

# Signed releases are explicit decisions on a trusted main-branch commit.
# This deliberately does not reuse PR artifacts or accept arbitrary refs.
on:
  workflow_dispatch:
    inputs:
      version:
        description: Version name (X.Y.Z)
        required: true
        default: '0.1.0'
        type: string
      version_code:
        description: A new, unused version code
        required: true
        type: string
      track:
        description: Play testing track (beta is open testing)
        required: true
        default: beta
        type: choice
        options: [internal, alpha, beta]
      status:
        description: Use draft until the app has passed its first Play review
        required: true
        default: draft
        type: choice
        options: [draft, completed]

permissions:
  contents: read

concurrency:
  group: play-release
  cancel-in-progress: false

jobs:
  upload:
    if: github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    timeout-minutes: 30
    # Configure this environment to allow main only. Keep all signing secrets
    # here, not in repository-wide secrets available to other workflows.
    environment: play
    env:
      APP_VERSION: ${{ inputs.version }}
      VERSION_CODE: ${{ inputs.version_code }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ github.sha }}
          persist-credentials: false
      - name: Validate release inputs
        run: |
          set -euo pipefail
          [[ "$APP_VERSION" =~ ^[0-9]+\.[0-9]+\.[0-9]+$ ]] || { echo 'Version must be X.Y.Z.' >&2; exit 1; }
          [[ "$VERSION_CODE" =~ ^[1-9][0-9]{0,8}$ ]] || { echo 'Version code must be a positive integer.' >&2; exit 1; }
      - uses: actions/setup-java@77dd5b2ce225ea11469928ac317850245a74ae78 # v6.2.0
        with:
          distribution: temurin
          java-version: '21'
      # No shared Gradle cache in the signing job.
      - uses: gradle/actions/setup-gradle@8da46b539cd8fe6ab27ca75128919a18d757604c # v6.4.1
        with:
          cache-disabled: true
      - name: Unit tests
        run: ./gradlew :app:testDebugUnitTest
      - name: Install temporary upload key
        env:
          PLAY_UPLOAD_KEYSTORE_BASE64: ${{ secrets.PLAY_UPLOAD_KEYSTORE_BASE64 }}
        run: |
          set -euo pipefail
          [[ -n "$PLAY_UPLOAD_KEYSTORE_BASE64" ]] || { echo 'Set PLAY_UPLOAD_KEYSTORE_BASE64 in the play environment.' >&2; exit 1; }
          umask 077
          printf '%s' "$PLAY_UPLOAD_KEYSTORE_BASE64" | base64 --decode > "$RUNNER_TEMP/upload.p12"
      - name: Build signed release bundle
        env:
          SLIPSTREAM_UPLOAD_KEYSTORE: ${{ runner.temp }}/upload.p12
          SLIPSTREAM_UPLOAD_PASSWORD: ${{ secrets.PLAY_UPLOAD_KEYSTORE_PASSWORD }}
        run: |
          ./gradlew :app:bundleRelease \
            -Pslipstream.versionName="$APP_VERSION" \
            -Pslipstream.versionCode="$VERSION_CODE"
          jarsigner -verify app/build/outputs/bundle/release/app-release.aab | grep -q 'jar verified.'
      - name: Remove upload key
        if: always()
        run: rm -f "$RUNNER_TEMP/upload.p12"
      - name: Upload to Google Play
        uses: r0adkll/upload-google-play@e738b9dd8f2476ea806d921b64aacd24f34515a5 # v1.1.5
        with:
          serviceAccountJsonPlainText: ${{ secrets.PLAY_SERVICE_ACCOUNT_JSON }}
          packageName: cc.pixp.slipstream
          releaseFiles: app/build/outputs/bundle/release/app-release.aab
          releaseName: ${{ inputs.version }} (${{ inputs.version_code }})
          tracks: ${{ inputs.track }}
          status: ${{ inputs.status }}
